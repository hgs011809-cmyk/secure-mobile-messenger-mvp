name: Matrix browser SAS and cold reopen (synthetic)
on:
  workflow_dispatch:
  push:
    paths:
      - 'experimental/matrix-client/**'
      - '.github/workflows/matrix-browser-crypto.yml'
permissions:
  contents: read
concurrency:
  group: matrix-browser-crypto-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-crypto:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser dependencies
        working-directory: experimental/matrix-client
        run: npm ci --ignore-scripts --no-audit --no-fund --loglevel=error > /dev/null 2>&1
      - name: Receiver and sender fail-closed regression tests
        working-directory: experimental/matrix-client
        run: npm test
      - name: Build loopback-only browser harness
        working-directory: experimental/matrix-client
        run: npm run build
      - name: Install test Chromium
        working-directory: experimental/matrix-client
        run: npx playwright install --with-deps chromium > /dev/null 2>&1
      - name: Pull pinned synthetic Synapse
        run: docker pull matrixdotorg/synapse:v1.162.0@sha256:6b84a7bbac36f080b2d2e51e0289cf1b08b349598ea44a558df38d558f2c2311 > /dev/null 2>&1
      - name: Prepare disposable isolated server
        working-directory: infra/ncp/matrix-lab/ci
        run: |
          set -euo pipefail
          export CI_UID="$(id -u)" CI_GID="$(id -g)"
          echo "CI_UID=$CI_UID" >> "$GITHUB_ENV"
          echo "CI_GID=$CI_GID" >> "$GITHUB_ENV"
          python3 configure.py
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.yaml up -d --pull never > /dev/null 2>&1
      - name: Actual Rust SAS and full Chromium process cold reopen
        timeout-minutes: 11
        working-directory: experimental/matrix-client
        run: |
          set -euo pipefail
          node serve.mjs > /dev/null 2>&1 &
          web_pid=$!
          trap 'kill "$web_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 50); do curl -fsS http://127.0.0.1:19461/live.html > /dev/null 2>&1 && break; sleep .1; done
          node cold-browser-ci.mjs
      - name: Always destroy synthetic server and state
        if: always()
        working-directory: infra/ncp/matrix-lab/ci
        run: |
          docker compose -f compose.yaml down --volumes --remove-orphans --timeout 5 > /dev/null 2>&1 || true
          rm -rf -- runtime
