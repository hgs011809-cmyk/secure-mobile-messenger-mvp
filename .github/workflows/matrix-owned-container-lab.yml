name: Precreated owned container child and Chromium containment
on:
  workflow_dispatch:
  push:
    branches: [lab-matrix-cleanup-followup]
    paths:
      - '.github/workflows/matrix-owned-container-lab.yml'
permissions:
  contents: read
concurrency:
  group: owned-container-proof-${{ github.ref }}
  cancel-in-progress: false
jobs:
  containment:
    if: github.ref == 'refs/heads/lab-matrix-cleanup-followup'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Private owned fixture namespace
        run: |
          set -euo pipefail
          umask 077
          root="$(mktemp -d "${RUNNER_TEMP:?}/owned-containment.XXXXXX")"
          chmod 700 "$root"
          logroot="$(mktemp -d "${RUNNER_TEMP:?}/owned-container-logs.XXXXXX")"
          chmod 700 "$logroot"
          printf 'PRIVATE_CONTAINMENT_ROOT=%s\nPRIVATE_CONTAINMENT_LOG_ROOT=%s\nCONTAINMENT_RUN_STARTED=0\n' "$root" "$logroot" >> "$GITHUB_ENV"
      - name: Immutable historical source and candidate guards
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_REF" = 'refs/heads/lab-matrix-cleanup-followup'
          node -e 'const f=require("node:fs"),c=require("node:crypto"),p=require("node:path"),pins={"experimental/matrix-client/descriptor-hooks.inc.mjs":"141c222b64b02e336950aa9dd8acb5cfca757a3b351d4aebcb10d8b0c5514554","experimental/matrix-client/descriptor-driver.inc.mjs":"92c18995a76d507f5d056428b9087954e06a9027bbc3083ca933517370585ae8","experimental/matrix-client/descriptor-fixture.inc.mjs":"9358cd1dc9c2b4bdcb997aa246d4324749f4bfd1e80c457037041c7d14fe4582","experimental/matrix-client/descriptor-browser.html":"f6b4418a21eb653bfc4e7893dea90f3cae10a2e6cbd8c66cb9f6cb6f1a8936c9","experimental/matrix-client/descriptor-build.mjs":"84729488b5adc137e4b131fe469609b18cd449ddf3ba374afbb6ff5307f6942e","experimental/matrix-client/descriptor-composed-ci.mjs":"402ef61d8d7f52e121d3a4409bffadb079f4291424631126c65346f049ce51fc","experimental/matrix-client/descriptor-receipt.mjs":"44e5f862245629caf83f080430c47cfd9a77cac148a6f5f6d70cce9e10a84fb4","experimental/matrix-client/descriptor-receipt.spec.mjs":"7a8505bf52983671fcfbc086ce226c1289b82f45e1916d042ff99a3705c51b18","experimental/media-transfer-lab/attachment-stream.mjs":"1c29cfc0c6ba05c0e4614b43e1d18de12b91bc478a119c59f13760295351c2c6","experimental/matrix-client/conversation.mjs":"5703ee41c6de769d65427621ec1d771a58a492e145c7a66cf3ff5648724cbb98","experimental/matrix-client/client.mjs":"f9f29e0b6ba52f297003673bc1a6f481bb29d9f6cc6c37a9842b12f9c3acc5d5","experimental/auth-bridge/sdk-binding.mjs":"e505214ec1020d676a310da283f5d3387c48086dbf507e3f8fedbbd2dd281503","experimental/auth-bridge/sdk-policy.mjs":"e6b9bf86b45cb38d8829e9ac35c7f1534783bf9b9077ddad862681261db3a4d3","experimental/auth-bridge/sdk-ingress.mjs":"d2c415e09cc10662ba84984e719ff277b6a6f0eae537bcda58d93b6a18b1a735","experimental/matrix-client/transport-pipeline.mjs":"07cafe5952aaf48839810b881674a44d2778111dc5c9e36e33f7a33dd2e6656d","experimental/matrix-client/transport-pipeline.spec.mjs":"fc6f3e1e144a121748118c10ac7fa20a95aa47dc5cded58eeedfd939bdfd3094","experimental/matrix-client/transport-hooks.inc.mjs":"bf201dea666c5d1111a0ab3d10df6468b5934d5c97050735983a837b8d682876","experimental/matrix-client/transport-browser.html":"8dd69fccc470ff1ed08c53ec4fd06e819db650878ef8757b085d32dee093ea18","experimental/matrix-client/transport-build.mjs":"1f25714516cb8341279fb7f779fee26a4b3ce7fc20237011e3ed2156d4806059","experimental/matrix-client/transport-prefix.inc.mjs":"7666a81d76d8a16dfd0ad6c161de73d94a9ee74cb39ee7d0f05be1cd2e8a2c39","experimental/matrix-client/transport-driver.inc.mjs":"af04cb26658fa228581f84754349cf76a5d5f07c55eb59cabc0e02ffb0569422","experimental/matrix-client/transport-revoke.inc.mjs":"b1a81c2f1726f1689da309b61e42d5348d6a053909a114d828333692c1712183","experimental/matrix-client/transport-composed-ci.mjs":"f13f7b42278e8448e4ed97e056473ca01c59afa21785456b3eb3a84d3d1dab88","experimental/media-transfer-lab/receiver.mjs":"deb1110aa3d43cfbd9cad917f577412812fc922579e523d328bab101ade71842","experimental/auth-bridge/broker.mjs":"837b7a35d36b75552c220afb835444f7c994a771bde16336c28117ef69907916","experimental/auth-bridge/lifecycle.mjs":"19df008875b8cb2569bb79dbfc3ab3ec0ec83051578cd31656371114e0e05512","experimental/auth-bridge/store.mjs":"1daf59dc1710b902280fa3eee16cdfd74e5ea1511ad12614ea08d875a0607c89","experimental/auth-bridge/synapse-lab-issuer.mjs":"69e469d64675edbdf7695a0aab7012b1c7adb80684ab62617ec584c36f315277","experimental/media-transfer-lab/process-restart-worker.mjs":"68e724111aeecff964f586a498b8248972421e0647e19007b9aa5c284e03130f","experimental/media-transfer-lab/process-restart.spec.mjs":"3fb97f356325cc48975a798722dfff13ae20599dc2ad373f04178e3fc6568992","experimental/media-transfer-lab/process-restart-cleanup.cjs":"14878ea6b21231f06c6c485ecf466ba623ae45866836c1a41ef3466e16f9e36d","experimental/owned-container-lab/container-worker.mjs":"9e138248e6782fb38faeab61874c0293ad31bcc4b445efd21c0906dc869710b0","experimental/owned-container-lab/container-control.cjs":"d02d3303e3e1e524549b7179e05308b062ac086dfcff72ea687e6b3b62eb72a6","experimental/owned-container-lab/container-control.spec.cjs":"66e6b5d06e4bc7bcc572b575062432ffa39293487d4507890e935018239f344f","experimental/owned-container-lab/Dockerfile":"d7496b9073db715ad6c0f3894bdc12abb0a01a1c2e651991a2402a2160835db7","experimental/owned-container-lab/CONTAINMENT.md":"a756f7f3722f68c3f12ebec0a204383a452349230ff040c0f36f00bd8970b1d4","experimental/matrix-client/package.json":"33f10febea5c27104d4fdadef2b52a8819aa784a25047ccf4afec7f3f42cc0cc","experimental/matrix-client/package-lock.json":"af8f94989d03eb33cd42ff8e4ee04f935248405b606137eff249ede0136efbba"};for(const [n,h]of Object.entries(pins))if(c.createHash("sha256").update(f.readFileSync(p.join(process.env.GITHUB_WORKSPACE,n))).digest("hex")!==h)process.exit(1);console.log("source_policy_pins=38; verified=true; existing_policy_unchanged=true");' > "$PRIVATE_CONTAINMENT_LOG_ROOT/guards.log" 2>&1 || { echo 'source_guards=failed; raw_diagnostics_suppressed=true'; exit 1; }
          rm -- "$PRIVATE_CONTAINMENT_LOG_ROOT/guards.log"
          echo 'source_policy_pins=38; verified=true; existing_policy_unchanged=true'
      - name: Four exact ownership contract tests
        run: |
          set -euo pipefail
          umask 077
          log="$PRIVATE_CONTAINMENT_LOG_ROOT/contract.log"
          if ! node --test --test-concurrency=1 experimental/owned-container-lab/container-control.spec.cjs > "$log" 2>&1; then
            node -e 'const f=require("node:fs"),t=f.readFileSync(process.argv[1],"utf8");console.log(JSON.stringify({contract_failed:true,case_indexes:[...t.matchAll(/^not ok ([0-9]+) -/gm)].map(m=>Number(m[1])),raw_diagnostics_suppressed:true}));' "$log"
            exit 1
          fi
          grep -qx '# tests 4' "$log" && grep -qx '# pass 4' "$log" && grep -qx '# fail 0' "$log" && grep -qx '# cancelled 0' "$log" && grep -qx '# skipped 0' "$log"
          echo 'ownership_contract_tests=4; pass=4; fail=0; cancelled=0; skipped=0; actual_runtime_proof=false'
      - name: Resolve immutable base and build private public-source image
        run: |
          set -euo pipefail
          umask 077
          root="$PRIVATE_CONTAINMENT_LOG_ROOT"
          mkdir -p "$root/context/experimental/matrix-client" "$root/context/experimental/owned-container-lab"
          cp experimental/matrix-client/package.json experimental/matrix-client/package-lock.json "$root/context/experimental/matrix-client/"
          cp experimental/owned-container-lab/container-worker.mjs experimental/owned-container-lab/Dockerfile "$root/context/experimental/owned-container-lab/"
          if ! docker pull node:22-bookworm-slim > "$root/base-pull.log" 2>&1; then echo 'image_prepare=failed; stage=base_pull; raw_diagnostics_suppressed=true'; exit 1; fi
          docker image inspect node:22-bookworm-slim > "$root/base-inspect.json"
          node -e 'const f=require("node:fs"),x=JSON.parse(f.readFileSync(process.argv[1],"utf8"));const r=x[0]?.RepoDigests?.find(s=>/^node@sha256:[a-f0-9]{64}$/.test(s));if(!r)process.exit(1);f.writeFileSync(process.argv[2],r,{mode:384,flag:"wx"});' "$root/base-inspect.json" "$root/base.ref"
          base="$(cat "$root/base.ref")"
          if ! timeout --kill-after=10s 420s docker build --build-arg "BASE=$base" --iidfile "$root/image.id" -f "$root/context/experimental/owned-container-lab/Dockerfile" "$root/context" > "$root/build.log" 2>&1; then echo 'image_prepare=failed; stage=bounded_build; raw_diagnostics_suppressed=true'; exit 1; fi
          node -e 'const f=require("node:fs"),id=f.readFileSync(process.argv[1],"utf8").trim();if(!/^sha256:[a-f0-9]{64}$/.test(id))process.exit(1);f.appendFileSync(process.env.GITHUB_ENV,"CONTAINMENT_IMAGE_ID="+id+"\n");' "$root/image.id"
          echo 'public_dependency_image_built=true; base_digest_resolved=true; runtime_image_exact_ID=true; workload_network_not_started=true'
      - name: Two genuine child Chromium contained lifecycle cases
        run: |
          set -euo pipefail
          umask 077
          printf 'CONTAINMENT_RUN_STARTED=1\n' >> "$GITHUB_ENV"
          log="$PRIVATE_CONTAINMENT_LOG_ROOT/runtime.log"
          if ! timeout --kill-after=5s 180s node experimental/owned-container-lab/container-control.cjs --run > "$log" 2>&1; then
            echo 'contained_runtime=failed; raw_diagnostics_suppressed=true'
            exit 1
          fi
          node -e 'const f=require("node:fs"),lines=f.readFileSync(process.argv[1],"utf8").trim().split(/\r?\n/);if(lines.length!==1)process.exit(1);const r=JSON.parse(lines[0]);if(r.status!=="passed"||r.cases!==2||r.pass!==2||r.fail!==0||r.graceful!==true||r.timeout!==true||r.preStartOwnership!==true||r.genuineChromium!==true||r.privatePIDNamespace!==true||r.networkNone!==true||r.noHostPIDSignals!==true||r.actualSDKIntegration!==false)process.exit(1);console.log("owned_container_runtime_cases=2; pass=2; fail=0; precreated_ID_and_exact_ownership=true; genuine_Node_child_and_Chromium=true; private_PID_namespace=true; network_none=true; graceful_exit=true; owned_container_timeout_stop=true; no_host_workload_PID_signals=true; actual_SDK_integration=false; physical_erasure=false; hard_runner_loss=false; production_changes=false");' "$log"
      - name: Independent exact owned container and namespace cleanup
        if: always()
        run: |
          set -euo pipefail
          umask 077
          if [ "${CONTAINMENT_RUN_STARTED:-0}" = 1 ]; then
            if ! result="$(node experimental/owned-container-lab/container-control.cjs --cleanup 2>/dev/null)"; then echo 'independent_cleanup=failed; raw_diagnostics_suppressed=true'; exit 1; fi
            node -e 'const r=JSON.parse(process.argv[1]);if(r.status!=="cleanup_verified"||r.containersAbsent!==true||r.privateRootAbsent!==true)process.exit(1);console.log("independent_cleanup=verified; exact_owned_containers_absent=true; private_namespace_absent=true; host_workload_PID_signals=false; physical_erasure=false");' "$result"
          else
            node -e 'const f=require("node:fs"),p=require("node:path"),r=process.env.PRIVATE_CONTAINMENT_ROOT;if(!r||p.dirname(r)!==process.env.RUNNER_TEMP||!p.basename(r).startsWith("owned-containment."))process.exit(1);const s=f.lstatSync(r);if(!s.isDirectory()||s.isSymbolicLink()||s.uid!==process.getuid()||(s.mode&4095)!==448)process.exit(1);f.rmSync(r,{recursive:true});if(f.existsSync(r))process.exit(1);console.log("runtime_not_started=true; private_namespace_absent=true; container_runtime_cleanup_claim=false");'
          fi
          node -e 'const f=require("node:fs"),p=require("node:path"),r=process.env.PRIVATE_CONTAINMENT_LOG_ROOT;if(!r||p.dirname(r)!==process.env.RUNNER_TEMP||!p.basename(r).startsWith("owned-container-logs."))process.exit(1);const s=f.lstatSync(r);if(!s.isDirectory()||s.isSymbolicLink()||s.uid!==process.getuid()||(s.mode&4095)!==448)process.exit(1);f.rmSync(r,{recursive:true});if(f.existsSync(r))process.exit(1);console.log("independent_build_log_namespace_absent=true; physical_erasure=false");'
