name: Deploy NCP pilot

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-ncp-pilot
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HOST: 211.233.206.144
      HOST_FINGERPRINT: SHA256:Zm5aAv5DJ/EnKiObKSadOxA5nKuXgToCGhNiyhVhAjY
      SSH_KEY: ${{ secrets.NCP_SSH_KEY }}
    steps:
      - uses: actions/checkout@v7

      - name: Prepare verified SSH connection
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/ncp_key
          chmod 600 ~/.ssh/ncp_key
          runner_ip="$(curl --max-time 8 -fsS https://api.ipify.org || curl --max-time 8 -fsS https://checkip.amazonaws.com)"
          echo "::notice::Temporarily allow TCP 22 from $runner_ip/32 in secure-msg-acg."
          : > ~/.ssh/known_hosts
          for attempt in $(seq 1 48); do
            if ssh-keyscan -T 5 -t ed25519 "$HOST" > ~/.ssh/known_hosts 2>/dev/null; then
              break
            fi
            sleep 10
          done
          test -s ~/.ssh/known_hosts
          actual=$(ssh-keygen -lf ~/.ssh/known_hosts | awk '{print $2}')
          test "$actual" = "$HOST_FINGERPRINT"

      - name: Inspect existing remote stack
        continue-on-error: true
        run: |
          ssh -o BatchMode=yes -i ~/.ssh/ncp_key root@$HOST 'docker ps -a --filter name=secure-messenger-infra --format "table {{.Names}}\t{{.Status}}\t{{.Image}}"; docker logs --tail 80 secure-messenger-infra-auth-1 2>&1 || true; docker logs --tail 80 secure-messenger-infra-peerjs-1 2>&1 || true; docker logs --tail 120 secure-messenger-infra-caddy-1 2>&1 || true; docker logs --tail 120 secure-messenger-infra-coturn-1 2>&1 || true; timeout 8 bash -c "</dev/tcp/172.65.46.172/443" && echo outbound-443-ok || echo outbound-443-failed; docker inspect --format "{{json .State}}" secure-messenger-infra-coturn-1 2>&1 || true; docker run --rm --entrypoint /bin/sh coturn/coturn:4.18.0-alpine -c "id; command -v turnserver; ls -l /usr/bin/turnserver /usr/local/bin/turnserver 2>/dev/null || true; turnserver --version" 2>&1 || true'

      - name: Check remote image cache
        id: remote
        run: |
          if ssh -o BatchMode=yes -i ~/.ssh/ncp_key root@$HOST 'docker image inspect caddy:2.11.7-alpine peerjs/peerjs-server:1.0.2 coturn/coturn:4.18.0-alpine secure-msg-auth:local >/dev/null 2>&1'; then
            echo "images=true" >> "$GITHUB_OUTPUT"
          else
            echo "images=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Use legacy Docker image store
        if: steps.remote.outputs.images != 'true'
        run: |
          sudo install -d -m 755 /etc/docker
          printf '{"features":{"containerd-snapshotter":false}}\n' | sudo tee /etc/docker/daemon.json >/dev/null
          sudo systemctl restart docker
          docker info --format '{{.Driver}}'

      - name: Prepare pinned container images
        if: steps.remote.outputs.images != 'true'
        run: |
          docker pull caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
          docker pull peerjs/peerjs-server:1.0.2@sha256:77194fb7803430832a39b84f1b1a7a413fe0e438ff39a7de3b2b62be0c184c02
          docker pull coturn/coturn:4.18.0-alpine@sha256:c29135c08565810d37053f384584392b7c24b69570fc81a721b878d6fe63e04e
          docker pull node:22.23.3-alpine3.24@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402
          docker tag "$(docker image inspect --format '{{.Id}}' caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f)" caddy:2.11.7-alpine
          docker tag "$(docker image inspect --format '{{.Id}}' peerjs/peerjs-server:1.0.2@sha256:77194fb7803430832a39b84f1b1a7a413fe0e438ff39a7de3b2b62be0c184c02)" peerjs/peerjs-server:1.0.2
          docker tag "$(docker image inspect --format '{{.Id}}' coturn/coturn:4.18.0-alpine@sha256:c29135c08565810d37053f384584392b7c24b69570fc81a721b878d6fe63e04e)" coturn/coturn:4.18.0-alpine
          docker tag "$(docker image inspect --format '{{.Id}}' node:22.23.3-alpine3.24@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402)" node:22.23.3-alpine3.24
          docker build --pull=false -t secure-msg-auth:local infra/ncp/auth
          set -o pipefail
          docker save caddy:2.11.7-alpine peerjs/peerjs-server:1.0.2 coturn/coturn:4.18.0-alpine secure-msg-auth:local | gzip -1 > /tmp/ncp-images.tar.gz
          tar -tzf /tmp/ncp-images.tar.gz | grep -qx manifest.json

      - name: Prepare deployment configuration
        run: |
          tar -C infra -czf /tmp/ncp.tar.gz ncp
          cat > /tmp/ncp.env <<'ENV'
          SIGNAL_HOST=signal.thevault73.com
          API_HOST=api.thevault73.com
          TURN_REALM=turn.thevault73.com
          APP_ORIGIN=https://hgs011809-cmyk.github.io
          ACME_EMAIL=hgs011809-cmyk@users.noreply.github.com
          PUBLIC_IP=211.233.206.144
          RELAY_IP=10.20.0.6
          TURN_MIN_PORT=49160
          TURN_MAX_PORT=49200
          ENV
          chmod 600 /tmp/ncp.env

      - name: Transfer deployment files and images
        run: |
          scp -o BatchMode=yes -i ~/.ssh/ncp_key /tmp/ncp.tar.gz /tmp/ncp.env root@$HOST:/root/
          if [ "${{ steps.remote.outputs.images }}" != "true" ]; then
            scp -o BatchMode=yes -i ~/.ssh/ncp_key /tmp/ncp-images.tar.gz root@$HOST:/root/
          fi
          ssh -o BatchMode=yes -i ~/.ssh/ncp_key root@$HOST 'mkdir -p /opt/secure-mobile-messenger-mvp/infra && tar -xzf /root/ncp.tar.gz -C /opt/secure-mobile-messenger-mvp/infra && install -m 600 /root/ncp.env /opt/secure-mobile-messenger-mvp/infra/ncp/.env && rm -f /root/ncp.tar.gz /root/ncp.env'

      - name: Deploy authenticated signaling and TURN stack
        run: |
          ssh -o BatchMode=yes -i ~/.ssh/ncp_key root@$HOST 'bash -se' <<'REMOTE'
          set -euo pipefail
          if [ -f /root/ncp-images.tar.gz ]; then
            gunzip -c /root/ncp-images.tar.gz | docker load
            rm -f /root/ncp-images.tar.gz
          fi
          cd /opt/secure-mobile-messenger-mvp/infra/ncp
          chmod +x turn/start-coturn.sh scripts/*.sh
          if [ ! -f secrets/turn_shared_secret ] && [ ! -f secrets/admin_secret ]; then
            ./scripts/generate-secrets.sh
          fi
          chown root:root secrets/admin_secret secrets/turn_shared_secret
          chmod 0600 secrets/admin_secret secrets/turn_shared_secret
          ./scripts/preflight.sh
          chgrp 4242 secrets/admin_secret secrets/turn_shared_secret
          chmod 0640 secrets/admin_secret secrets/turn_shared_secret
          cat > /tmp/compose.offline.yaml <<'COMPOSE'
          services:
            caddy:
              image: caddy:2.11.7-alpine
              pull_policy: never
            auth:
              image: secure-msg-auth:local
              pull_policy: never
            peerjs:
              image: peerjs/peerjs-server:1.0.2
              pull_policy: never
            coturn:
              image: coturn/coturn:4.18.0-alpine
              pull_policy: never
          COMPOSE
          if ! docker compose -f compose.yaml -f /tmp/compose.offline.yaml up -d --no-build --pull never; then
            docker compose -f compose.yaml -f /tmp/compose.offline.yaml ps -a || true
            docker compose -f compose.yaml -f /tmp/compose.offline.yaml logs --no-color --tail 100 || true
            exit 1
          fi
          docker compose -f compose.yaml -f /tmp/compose.offline.yaml restart caddy
          ufw default deny incoming
          ufw default allow outgoing
          ufw allow 22/tcp
          ufw allow 80/tcp
          ufw allow 443/tcp
          ufw allow 3478/tcp
          ufw allow 3478/udp
          ufw allow 49160:49200/udp
          ufw --force enable
          printf 'PasswordAuthentication no\nPermitRootLogin prohibit-password\n' > /etc/ssh/sshd_config.d/99-hardening.conf
          sshd -t
          systemctl reload ssh
          docker compose ps
          REMOTE

      - name: Smoke-test authenticated API, signaling, and TURN
        env:
          API_BASE: https://api.thevault73.com
          SIGNAL_HOST: signal.thevault73.com
        run: |
          set -euo pipefail
          invite_json="$(printf '%s' '' | base64 -d | ssh -o BatchMode=yes -i ~/.ssh/ncp_key root@$HOST 'docker exec -i secure-messenger-infra-auth-1 node -')"
          printf '%s' "$invite_json" > /tmp/invite.json

          revoke_device() {
            [ -f /tmp/device-id ] || return 0
            device_id="$(cat /tmp/device-id)"
            printf '%s' '' | base64 -d | ssh -o BatchMode=yes -i ~/.ssh/ncp_key root@$HOST "docker exec -i -e DEVICE_ID='$device_id' secure-messenger-infra-auth-1 node -"
          }
          cleanup() {
            revoke_device >/dev/null 2>&1 || true
            rm -f /tmp/invite.json /tmp/turn-user /tmp/turn-pass /tmp/device-id /tmp/peer-id
          }
          trap cleanup EXIT

          node infra/ncp/scripts/smoke-test.mjs auth
          echo "::add-mask::$(cat /tmp/turn-user)"
          echo "::add-mask::$(cat /tmp/turn-pass)"

          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq coturn >/dev/null
          timeout 30s turnutils_uclient -s -y -c -n 1 -u "$(cat /tmp/turn-user)" -w "$(cat /tmp/turn-pass)" turn.thevault73.com
          echo "UDP TURN authentication and allocation completed; self-relay return traffic is blocked by policy."
          timeout 30s turnutils_uclient -t -s -y -c -n 1 -u "$(cat /tmp/turn-user)" -w "$(cat /tmp/turn-pass)" turn.thevault73.com
          echo "TCP TURN allocation and relay passed."

          revoke_device
          node infra/ncp/scripts/smoke-test.mjs revoked
          trap - EXIT
          rm -f /tmp/invite.json /tmp/turn-user /tmp/turn-pass /tmp/device-id /tmp/peer-id
