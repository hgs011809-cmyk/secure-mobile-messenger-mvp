name: Matrix deletion repeat load restart (synthetic)
on:
  workflow_dispatch:
  push:
    paths:
      - 'experimental/matrix-retention-lab/**'
      - '.github/workflows/matrix-retention-lab.yml'
  pull_request:
    paths:
      - 'experimental/matrix-retention-lab/**'
      - '.github/workflows/matrix-retention-lab.yml'
permissions:
  contents: read
concurrency:
  group: matrix-retention-lab-${{ github.ref }}
  cancel-in-progress: true
jobs:
  retention:
    name: retention-trial-${{ matrix.trial }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        trial: [1, 2]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Conservative clock and safe probe regressions
        run: |
          set -euo pipefail
          node --test experimental/matrix-retention-lab/measurement.spec.mjs
          node --check experimental/matrix-retention-lab/integration.mjs
          cd experimental/matrix-retention-lab
          python3 -m unittest probe_rows_test.py
      - name: Install exact SDK43 package without hooks
        working-directory: experimental/matrix-client
        run: npm ci --ignore-scripts --no-audit --no-fund --loglevel=error > /dev/null 2>&1
      - name: Pull pinned Synapse image
        run: |
          set -euo pipefail
          if ! docker pull matrixdotorg/synapse:v1.162.0@sha256:6b84a7bbac36f080b2d2e51e0289cf1b08b349598ea44a558df38d558f2c2311 > /dev/null 2>&1; then
            echo 'Synthetic image pull failed; no runtime result.'
            exit 1
          fi
      - name: Prepare isolated ephemeral server
        working-directory: infra/ncp/matrix-lab/ci
        run: |
          set -euo pipefail
          echo "CI_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "CI_GID=$(id -g)" >> "$GITHUB_ENV"
          export CI_UID="$(id -u)" CI_GID="$(id -g)"
          python3 configure.py
          docker compose -f compose.yaml config --quiet
          if ! docker compose -f compose.yaml up -d --pull never > /dev/null 2>&1; then
            echo 'Synthetic startup failed; private logs suppressed.'
            exit 1
          fi
      - name: Repeat burst and same-volume restart measurement
        timeout-minutes: 15
        env:
          RETENTION_TRIAL: ${{ matrix.trial }}
        run: node experimental/matrix-retention-lab/integration.mjs
      - name: Resource observation is not NCP sizing
        if: always()
        working-directory: infra/ncp/matrix-lab/ci
        run: |
          set +e
          container="$(docker compose -f compose.yaml ps -q synapse 2>/dev/null)"
          if [ -n "$container" ]; then
            docker stats --no-stream --format 'memory={{.MemUsage}} cpu={{.CPUPerc}} block_io={{.BlockIO}}' "$container" 2>/dev/null
            docker inspect --format 'oom_killed={{.State.OOMKilled}} exit_code={{.State.ExitCode}}' "$container" 2>/dev/null
          fi
          exit 0
      - name: Always destroy private fixture and runtime
        if: always()
        working-directory: infra/ncp/matrix-lab/ci
        run: |
          set +e
          docker compose -f compose.yaml down --volumes --remove-orphans --timeout 5 > /dev/null 2>&1
          rm -rf -- runtime
          exit 0
