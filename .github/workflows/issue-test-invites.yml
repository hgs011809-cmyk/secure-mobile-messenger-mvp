name: Issue Android test invites

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue-android-test-invites
  cancel-in-progress: false

jobs:
  issue:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      HOST: 211.233.206.144
      HOST_FINGERPRINT: SHA256:Zm5aAv5DJ/EnKiObKSadOxA5nKuXgToCGhNiyhVhAjY
      SSH_KEY: ${{ secrets.NCP_SSH_KEY }}
    steps:
      - name: Wait for temporary runner IP allowlist
        run: |
          set -euo pipefail
          runner_ip="$(curl --max-time 8 -fsS https://api.ipify.org || curl --max-time 8 -fsS https://checkip.amazonaws.com)"
          echo "::notice::Temporarily allow TCP 22 from $runner_ip/32 in secure-msg-acg."
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/ncp_key
          chmod 600 ~/.ssh/ncp_key
          : > ~/.ssh/known_hosts
          for attempt in $(seq 1 48); do
            if ssh-keyscan -T 5 -t ed25519 "$HOST" > ~/.ssh/known_hosts 2>/dev/null; then
              break
            fi
            sleep 10
          done
          test -s ~/.ssh/known_hosts
          actual="$(ssh-keygen -lf ~/.ssh/known_hosts | awk '{print $2}')"
          test "$actual" = "$HOST_FINGERPRINT"

      - name: Issue two short-lived invites to the NCP console only
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/ncp_key root@$HOST 'bash -s' <<'REMOTE'
          set -euo pipefail
          container=secure-messenger-infra-auth-1
          invite_a_json="$(docker exec "$container" node src/cli.js create-invite 1800)"
          invite_b_json="$(docker exec "$container" node src/cli.js create-invite 1800)"
          invite_a="$(printf '%s\n' "$invite_a_json" | sed -n 's/^[[:space:]]*"inviteCode":[[:space:]]*"\([^"]*\)".*/\1/p')"
          invite_b="$(printf '%s\n' "$invite_b_json" | sed -n 's/^[[:space:]]*"inviteCode":[[:space:]]*"\([^"]*\)".*/\1/p')"
          test -n "$invite_a"
          test -n "$invite_b"
          display_dir="$(mktemp -d)"
          chmod 700 "$display_dir"
          docker exec "$container" npx --yes qrcode-terminal@0.12.0 "$invite_a" > "$display_dir/a.qr"
          docker exec "$container" npx --yes qrcode-terminal@0.12.0 "$invite_b" > "$display_dir/b.qr"
          {
            printf '\033c'
            printf '\nPHONE A - SCAN THIS QR WITH PHONE A\n\n'
            cat "$display_dir/a.qr"
            printf '\nCopy the scanned text into the app. PHONE B appears in 10 seconds.\n'
          } > "$display_dir/a.txt"
          {
            printf '\033c'
            printf '\nPHONE B - SCAN THIS QR WITH PHONE B\n\n'
            cat "$display_dir/b.qr"
            printf '\nCopy the scanned text into the app. PHONE A appears in 10 seconds.\n'
          } > "$display_dir/b.txt"
          chmod 600 "$display_dir"/*
          cat > "$display_dir/show.sh" <<'SHOW'
          #!/bin/sh
          dir="$1"
          i=0
          while [ "$i" -lt 45 ]; do
            timeout 3s sh -c 'cat "$1" > /dev/tty1' sh "$dir/a.txt" || true
            sleep 10
            timeout 3s sh -c 'cat "$1" > /dev/tty1' sh "$dir/b.txt" || true
            sleep 10
            i=$((i + 1))
          done
          rm -rf "$dir"
          SHOW
          chmod 700 "$display_dir/show.sh"
          timeout 3s sh -c 'cat "$1" > /dev/tty1' sh "$display_dir/a.txt" || true
          nohup "$display_dir/show.sh" "$display_dir" </dev/null >/dev/null 2>&1 &
          unset invite_a invite_b invite_a_json invite_b_json
          REMOTE
          echo "Invite codes were delivered only to the authenticated NCP server console."
