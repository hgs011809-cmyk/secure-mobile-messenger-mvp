          set -euo pipefail
          umask 077
          private_root="$(mktemp -d "${RUNNER_TEMP:?}/synthetic-pending-budget.XXXXXX")"
          chmod 700 "$private_root"
          printf 'PRIVATE_ATTACHMENT_ROOT=%s\nTMPDIR=%s\n' "$private_root" "$private_root" >> "$GITHUB_ENV"
