name: Synthetic logical ciphertext length budget
on:
  workflow_dispatch:
  push:
    branches: [lab-matrix-cleanup-followup]
    paths:
      - '.github/workflows/matrix-pending-budget-lab.yml'
permissions:
  contents: read
concurrency:
  group: synthetic-pending-budget-${{ github.ref }}
  cancel-in-progress: false
