name: Read-only phase-contract engine identity preflight
on:
  workflow_dispatch:
  push:
    branches: [lab-matrix-cleanup-followup]
    paths: ['.github/workflows/matrix-owned-container-phase-preflight.yml']
permissions:
  contents: read
