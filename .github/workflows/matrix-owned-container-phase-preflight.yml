      - name: Read only local daemon identity with fixed public classifications
        run: |
          set -euo pipefail
          umask 077
          root="$(mktemp -d "${RUNNER_TEMP:?}/phase-preflight.XXXXXX")"
          trap 'rm -rf -- "$root"' EXIT
          chmod 700 "$root"
          if ! timeout --kill-after=5s 15s env -u DOCKER_CONTEXT -u DOCKER_TLS_VERIFY -u DOCKER_CERT_PATH docker --host unix:///var/run/docker.sock info --format '{{json .}}' > "$root/info.json" 2> "$root/stderr.log"; then echo 'engine_preflight=failed; stage=readonly_transport; raw_diagnostics_suppressed=true'; exit 1; fi
