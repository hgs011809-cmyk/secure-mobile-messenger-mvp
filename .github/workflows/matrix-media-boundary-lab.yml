name: Matrix media boundaries synthetic only
on:
  workflow_dispatch:
  push:
    branches: [lab-matrix-cleanup-followup]
    paths:
      - 'experimental/media-transfer-lab/**'
      - '.github/workflows/matrix-media-boundary-lab.yml'
permissions:
  contents: read
concurrency:
  group: synthetic-media-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Private disposable ciphertext fixtures only
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          private_root="$(mktemp -d "${RUNNER_TEMP:?}/synthetic-media.XXXXXX")"
          chmod 700 "$private_root"
          printf 'PRIVATE_MEDIA_ROOT=%s\nTMPDIR=%s\n' "$private_root" "$private_root" >> "$GITHUB_ENV"
      - name: Ciphertext transport, loopback TCP disconnect, voice state and unchanged ingress
        shell: bash
        working-directory: experimental/media-transfer-lab
        run: |
          set -euo pipefail
          umask 077
          node -e 'const fs=require("node:fs"),os=require("node:os");if(fs.realpathSync(os.tmpdir())!==fs.realpathSync(process.env.PRIVATE_MEDIA_ROOT))process.exit(1);console.log("temporary_namespace=verified");'
          log="$PRIVATE_MEDIA_ROOT/test-output.log"
          if ! node --test --test-concurrency=1 receiver.spec.mjs voice-policy.spec.mjs ingress-regression.spec.mjs network.spec.mjs > "$log" 2>&1; then
            echo 'offline_boundary_tests=failed; diagnostics_suppressed=true'
            exit 1
          fi
          grep -qx '# tests 74' "$log"
          grep -qx '# pass 74' "$log"
          grep -qx '# fail 0' "$log"
          grep -qx '# skipped 0' "$log"
          echo 'synthetic_tests=74; pass=74; fail=0; skipped=0; ciphertext_fixture_bytes=67108864; processed_payload_bytes=262144; loopback_transfer_bytes=8388608'
          echo 'actual_voice_call=false; actual_internet_disconnect=false; actual_loopback_tcp_disconnect=true; matrix_media_integration=false; production_changes=false'
      - name: Independently verify private files removed
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${PRIVATE_MEDIA_ROOT:-}" || "$PRIVATE_MEDIA_ROOT" != "$RUNNER_TEMP"/synthetic-media.* ]]; then
            echo 'private_cleanup=failed; invalid_namespace=true'
            exit 1
          fi
          rm -rf -- "$PRIVATE_MEDIA_ROOT"
          test ! -e "$PRIVATE_MEDIA_ROOT"
          echo 'private_cleanup=verified; physical_erasure=false'
