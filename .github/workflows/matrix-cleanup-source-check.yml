name: Matrix cleanup candidate source checks only
on:
  workflow_dispatch:
  push:
    paths:
      - 'experimental/matrix-cleanup-candidate/**'
      - '.github/workflows/matrix-cleanup-source-check.yml'
  pull_request:
    paths:
      - 'experimental/matrix-cleanup-candidate/**'
      - '.github/workflows/matrix-cleanup-source-check.yml'
permissions:
  contents: read
concurrency:
  group: matrix-cleanup-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_IMAGE: matrixdotorg/synapse:v1.162.0@sha256:6b84a7bbac36f080b2d2e51e0289cf1b08b349598ea44a558df38d558f2c2311
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract public source from immutable image without running a server
        shell: bash
        run: |
          set -euo pipefail
          if ! docker pull "$BASE_IMAGE" > /dev/null 2>&1; then
            echo 'Pinned image pull failed.'
            exit 1
          fi
          if ! docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --memory 256m --cpus 1 -e PYTHONDONTWRITEBYTECODE=1 --entrypoint python "$BASE_IMAGE" -c 'import pathlib,synapse,sys; sys.stdout.write((pathlib.Path(synapse.__file__).parent / "storage/databases/main/censor_events.py").read_text())' > "$RUNNER_TEMP/censor-source.py" 2>/dev/null; then
            echo 'Public source extraction failed.'
            exit 1
          fi
      - name: Nine pinned source guards
        working-directory: experimental/matrix-cleanup-candidate
        shell: bash
        run: |
          set -euo pipefail
          export SYNAPSE_CENSOR_SOURCE="$RUNNER_TEMP/censor-source.py"
          node --test source-policy.spec.mjs
      - name: Generate temporary candidate and parse Python, never execute it
        working-directory: experimental/matrix-cleanup-candidate
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module -e 'import {readFileSync,writeFileSync} from "node:fs"; import {prepareCandidate,BASE_IMAGE} from "./source-policy.mjs"; const t=process.env.RUNNER_TEMP; writeFileSync(t+"/censor-candidate.py",prepareCandidate(readFileSync(t+"/censor-source.py","utf8"),{enabled:true,scope:"github-actions-synthetic",baseImage:BASE_IMAGE}));'
          python3 -c 'import ast,os,pathlib; ast.parse((pathlib.Path(os.environ["RUNNER_TEMP"])/"censor-candidate.py").read_text()); print("candidate_python_syntax=passed; runtime_executed=false")'
      - name: Remove public temporary sources
        if: always()
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/censor-source.py" "$RUNNER_TEMP/censor-candidate.py"
