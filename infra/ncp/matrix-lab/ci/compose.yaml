name: matrix-server-integration
services:
  synapse:
    image: matrixdotorg/synapse:v1.162.0@sha256:6b84a7bbac36f080b2d2e51e0289cf1b08b349598ea44a558df38d558f2c2311
    pull_policy: never
    user: "${CI_UID}:${CI_GID}"
    restart: "no"
    ports: ["127.0.0.1:18008:8008"]
    environment:
      SYNAPSE_CONFIG_PATH: /data/homeserver.yaml
    volumes:
      - ./runtime:/data
      - ./:/ci:ro
    networks: [offline]
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 256
    logging:
      driver: none
    security_opt: ["no-new-privileges:true"]
networks:
  offline:
    internal: true
