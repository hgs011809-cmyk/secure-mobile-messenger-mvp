<!doctype html><html lang="ko"><meta charset="utf-8"><title>Matrix 독립 개발 검증</title><body><h1>Matrix 독립 개발 검증</h1><p>운영 메신저가 아닌 합성 데이터 검증 화면입니다. 실제 초대 코드·토큰·메시지를 입력하지 마세요.</p><button id="run">로컬 검증 실행</button><pre id="result">대기</pre><script type="module">
import {createLabClient} from './client.mjs';
import {DeletionLedger} from './deletion-ledger.mjs';
const button=document.getElementById('run'),out=document.getElementById('result');
button.onclick=async()=>{button.disabled=true;let client,ledger;try{
 client=await createLabClient({baseUrl:'http://127.0.0.1:18008',userId:'@browser-fixture:matrix.lab',deviceId:'SYNTHETIC_BROWSER',accessToken:'synthetic-not-an-authentication-token'});
 if(!client.getCrypto()||client.getCrypto().globalBlacklistUnverifiedDevices!==true)throw new Error('crypto_not_ready');
 ledger=new DeletionLedger({name:'direct-matrix-browser-smoke'});await ledger.open();
 await ledger.put('!fixture:matrix.lab','$fixture',{status:'pending_server',body:'must-never-be-stored'});
 const stored=await ledger.get('!fixture:matrix.lab','$fixture');if(stored.status!=='pending_server'||'body' in stored)throw new Error('metadata_store_failed');
 ledger.close();await ledger.open();if((await ledger.get('!fixture:matrix.lab','$fixture'))?.status!=='pending_server')throw new Error('metadata_persistence_failed');
 out.textContent='PASS: Rust/WASM 초기화, 미검증 기기 차단, IndexedDB 삭제 메타데이터 저장·재열기, 평문 저장 제외';
}catch(error){out.textContent='FAIL: '+error.name;throw error;}finally{client?.stopClient();ledger?.close();button.disabled=false;}};
</script></body></html>
